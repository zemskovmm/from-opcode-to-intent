<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <title>Instant Calculator</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="calculator" aria-labelledby="page-title">
      <header>
        <div>
          <p class="eyebrow">INSTANT CALCULATOR</p>
          <h1 id="page-title">Work it out.</h1>
          <p class="subhead">Results update as you type.</p>
        </div>
        <button class="clear-all" type="button" id="clear-all">Clear all</button>
      </header>

      <section class="variables-panel" aria-labelledby="variables-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">NAMED VALUES</p>
            <h2 id="variables-title">Variables</h2>
          </div>
          <button class="add-variable" type="button" id="add-variable">Add variable</button>
        </div>
        <p class="variable-help">Use a name directly in a calculation, such as <code>electricity * 0.21</code>.</p>
        <table>
          <thead>
            <tr><th scope="col">Name</th><th scope="col">Value</th><th><span class="sr-only">Remove</span></th></tr>
          </thead>
          <tbody id="variable-rows"></tbody>
        </table>
      </section>

      <section class="workspace" aria-label="Ten calculations">
        <div id="rows"></div>
        <div class="total-row">
          <div>
            <span class="total-label">Total</span>
            <span class="total-detail" id="total-detail"></span>
          </div>
          <output class="total-result" id="total-result" aria-live="polite"></output>
        </div>
      </section>

      <section class="keypad-panel" aria-label="Calculator keypad">
        <div class="reference-picker" id="reference-picker" hidden>
          <span>Insert reference</span>
          <div id="reference-options"></div>
        </div>
        <div class="keypad" id="keypad"></div>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
